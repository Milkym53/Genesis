<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genesis</title>
    <style>
        :root { --red: #e50914; --bg: #141414; --card-w: 220px; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; cursor: none !important; }
        body { background: var(--bg); color: #fff; overflow-x: hidden; min-height: 100vh; }
        
        /* Moving Background Animation */
        .bg-animate { position: fixed; top:0; left:0; width:100%; height:100%; z-index:-1; background: radial-gradient(circle at 50% 50%, rgba(20,20,20,0.4), var(--bg)), url('https://transparenttextures.com'); background-size: cover; animation: shiftBg 25s infinite alternate linear; opacity: 0.65; }
        @keyframes shiftBg { 0% { background-position: 0% 0%; filter: hue-rotate(0deg); } 100% { background-position: 100% 100%; filter: hue-rotate(15deg); } }

        /* Custom Cursor */
        #cursor { width: 12px; height: 12px; border: 2px solid #fff; background: var(--red); border-radius: 50%; position: fixed; transform: translate(-50%, -50%); pointer-events: none; z-index: 9999; box-shadow: 0 0 10px var(--red); transition: width 0.1s, height 0.1s; }
        
        /* Navbar */
        nav { display: flex; align-items: center; justify-content: space-between; padding: 20px 4%; position: fixed; width: 100%; z-index: 100; background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%); }
        .logo { font-size: 2rem; font-weight: 900; letter-spacing: -1px; color: var(--red); text-transform: uppercase; text-shadow: 0 0 15px rgba(229,9,20,0.4); }
        .search { background: rgba(0,0,0,0.6); border: 1px solid #333; padding: 7px 15px; border-radius: 4px; color: #fff; outline: none; }

        /* Billboard Hero Section */
        .hero { height: 55vh; display: flex; flex-direction: column; justify-content: center; padding: 0 4%; background: linear-gradient(to top, var(--bg) 0%, transparent 80%); margin-bottom: 20px; }
        .hero h1 { font-size: 3.5rem; font-weight: 800; margin-bottom: 10px; }
        .hero p { max-width: 500px; color: #aaa; margin-bottom: 20px; font-size: 0.95rem; }
        .btn { background: #fff; color: #000; font-weight: bold; border: none; padding: 10px 24px; border-radius: 4px; font-size: 1rem; transition: 0.2s; }
        .btn:hover { background: rgba(255,255,255,0.75); }

        /* Movie / Game Rows */
        .row { padding: 0 4% 30px 4%; }
        .row h2 { font-size: 1.3rem; margin-bottom: 15px; color: #e5e5e5; }
        .slider { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 15px; scroll-behavior: smooth; }
        .slider::-webkit-scrollbar { display: none; }
        
        /* Netflix-style Scale Animation Cards */
        .card { flex: 0 0 var(--card-w); height: 125px; background: #222; border-radius: 4px; overflow: hidden; position: relative; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s; }
        .card:hover { transform: scale(1.3); z-index: 10; box-shadow: 0 10px 25px rgba(0,0,0,0.8); border: 1px solid #444; }
        .card-img { width: 100%; height: 100%; background-size: cover; background-position: center; transition: filter 0.3s; }
        .card:hover .card-img { filter: brightness(0.6); }
        .card-info { position: absolute; bottom: 0; padding: 10px; width: 100%; opacity: 0; transition: opacity 0.3s; font-size: 0.75rem; font-weight: bold; }
        .card:hover .card-info { opacity: 1; }
    </style>
</head>
<body>

    <div class="bg-animate"></div>
    <div id="cursor"></div>

    <nav>
        <div class="logo">Genesis</div>
        <input type="text" class="search" placeholder="Titles, genres, proxies...">
    </nav>

    <div class="hero">
        <h1>Genesis OS</h1>
        <p>Unlimited unblocked content, custom web engines, and streaming web clones running live on cloud servers.</p>
        <div><button class="btn" onclick="alert('Launching proxy terminal...')">▶ Launch Terminal</button></div>
    </div>

    <div class="row">
        <h2>Popular on Genesis</h2>
        <div class="slider">
            <a href="games/minecraft/" class="card">
                <div class="card-img" style="background-image: url('https://unsplash.com');"></div>
                <div class="card-info">Eaglercraft 1.8.8</div>
            </a>
            <a href="games/slope/" class="card">
                <div class="card-img" style="background-image: url('https://unsplash.com');"></div>
                <div class="card-info">Slope Client</div>
            </a>
            <div class="card"><div class="card-img" style="background-image: url('https://unsplash.com');"></div><div class="card-info">Retro Hub</div></div>
            <div class="card"><div class="card-img" style="background-image: url('https://unsplash.com');"></div><div class="card-info">Ultraviolet Engine</div></div>
            <div class="card"><div class="card-img" style="background-image: url('https://unsplash.com');"></div><div class="card-info">Settings</div></div>
        </div>
    </div>

    <script>
        // Custom Cursor Logic
        const cursor = document.getElementById('cursor');
        window.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });
        
        // Cursor Shrink/Expand effects on active clickable tags
        document.querySelectorAll('a, button, .card, input').forEach(elem => {
            elem.addEventListener('mouseenter', () => { cursor.style.width = '24px'; cursor.style.height = '24px'; cursor.style.background = 'transparent'; });
            elem.addEventListener('mouseleave', () => { cursor.style.width = '12px'; cursor.style.height = '12px'; cursor.style.background = 'var(--red)'; });
        });
    </script>
</body>
</html>
