<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genesis // Core Network</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Orbitron:wght@500;800;900&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: none !important; /* Forces custom cursor usage */
        }

        body {
            background-color: #030206;
            color: #ffffff;
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Interactive Cyber Matrix Background Canvas */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* 1000x Cooler Custom Neon Ring Cursor */
        #custom-cursor {
            width: 20px;
            height: 20px;
            border: 2px solid #00f0ff;
            border-radius: 50%;
            position: fixed;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 9999;
            transition: width 0.2s ease, height 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
            box-shadow: 0 0 15px #00f0ff, inset 0 0 10px #00f0ff;
        }

        #custom-cursor-dot {
            width: 4px;
            height: 4px;
            background-color: #ff007f;
            border-radius: 50%;
            position: fixed;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 0 10px #ff007f;
        }

        /* Core Panel Shell (Glassmorphic Cyber-Deck) */
        .cyber-deck {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 680px;
            padding: 35px;
            background: rgba(10, 8, 20, 0.65);
            border: 1px solid rgba(0, 240, 255, 0.15);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.05), inset 0 0 30px rgba(255, 0, 127, 0.02);
            text-align: center;
        }

        /* TungTung Active Subsystem Header */
        .node-status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 0, 127, 0.07);
            border: 1px solid rgba(255, 0, 127, 0.25);
            color: #ff007f;
            padding: 8px 18px;
            border-radius: 100px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 25px;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.1);
        }

        .node-status .live-indicator {
            width: 8px;
            height: 8px;
            background: #ff007f;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff007f;
            animation: pulse-glow 1.5s infinite ease-in-out;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 25px;
            background: linear-gradient(90deg, #00f0ff, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.2));
        }

        /* Micro Tab Architecture */
        .cyber-navigation {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 15px;
        }

        .nav-link {
            background: transparent;
            border: none;
            color: #5d5a6f;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 10px 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .nav-link.active, .nav-link:hover {
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -16px;
            left: 0;
            width: 0;
            height: 2px;
            background: #00f0ff;
            box-shadow: 0 0 10px #00f0ff;
            transition: all 0.3s ease;
        }

        .nav-link.active::after {
            width: 100%;
        }

        /* View Panels */
        .sub-panel {
            display: none;
            animation: pane-fade 0.4s ease forwards;
        }

        .sub-panel.active {
            display: block;
        }

        /* Hyper-Speed Input Framework */
        .input-chamber {
            position: relative;
            background: #090710;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 6px;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
        }

        .input-chamber:focus-within {
            border-color: #00f0ff;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.15), inset 0 0 15px rgba(0,0,0,0.6);
        }

        .input-chamber input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            padding: 14px 20px;
            color: #ffffff;
            font-size: 1.1rem;
        }

        .input-chamber input::placeholder {
            color: #3b384a;
        }

        .fire-btn {
            background: linear-gradient(135deg, #00f0ff, #7f00ff);
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 800;
            border: none;
            outline: none;
            padding: 14px 28px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            transition: all 0.2s ease;
        }

        .fire-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
        }

        /* High-Definition Responsive Game Array */
        .app-matrix-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            max-height: 290px;
            overflow-y: auto;
            padding-right: 6px;
        }

        .app-matrix-grid::-webkit-scrollbar {
            width: 4px;
        }
        .app-matrix-grid::-webkit-scrollbar-thumb {
            background: rgba(0, 240, 255, 0.3);
            border-radius: 10px;
        }

        .app-node-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 22px 10px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: #a4a1b5;
            transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .app-node-card:hover {
            background: rgba(0, 240, 255, 0.05);
            border-color: #00f0ff;
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 240, 255, 0.1);
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        @keyframes pane-fade {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 540px) {
            .app-matrix-grid { grid-template-columns: repeat(2, 1fr); }
            h1 { font-size: 2.6rem; }
        }
    </style>

    <!-- MANDATORY INJECTION ENGINE CODE MODULES -->
    <script src="uv/uv.bundle.js" defer></script>
    <script src="uv/uv.config.js" defer></script>
</head>
<body>

    <!-- Dynamic System Grid Vector Core -->
    <canvas id="bg-canvas"></canvas>

    <!-- Custom Cursor Nodes -->
    <div id="custom-cursor"></div>
    <div id="custom-cursor-dot"></div>

    <div class="cyber-deck">
        <div class="node-status">
            <div class="live-indicator"></div> GENESIS NODE ONLINE
        </div>
        
        <h1>GENESIS</h1>

        <!-- Navigation Array Elements -->
        <div class="cyber-navigation">
            <button class="nav-link active" onclick="navigateSubsystem('proxy-chamber', this)">PROXY HUB</button>
            <button class="nav-link" onclick="navigateSubsystem('matrix-apps', this)">GAMES & MATRIX</button>
        </div>

        <!-- Tab Panel Alpha: DuckDuckGo Secure Search Routing Core -->
        <div id="proxy-chamber" class="sub-panel active">
            <form id="secure-proxy-form">
                <div class="input-chamber">
                    <input id="hidden-search-engine" value="https://duckduckgo.com" type="hidden" />
                    <input id="user-destination-input" type="text" placeholder="Trace link grid or execute web search query..." autocomplete="off">
                    <button type="submit" class="fire-btn">EXECUTE</button>
