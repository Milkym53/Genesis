<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genesis</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1a1528 0%, #0d0b14 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 540px;
            padding: 20px;
            z-index: 2;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ff007f, #7f00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 0px 30px rgba(127, 0, 255, 0.3);
        }

        p {
            color: #9d9aa7;
            font-size: 1rem;
            margin-bottom: 35px;
        }

        form {
            width: 100%;
            position: relative;
        }

        input {
            width: 100%;
            padding: 18px 24px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            color: #fff;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        input:focus {
            border-color: #7f00ff;
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 20px rgba(127, 0, 255, 0.2), 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        input::placeholder {
            color: #625f6e;
        }

        .glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: #7f00ff;
            filter: blur(150px);
            opacity: 0.15;
            pointer-events: none;
            z-index: 1;
        }
    </style>
    
    <!-- CORE SCRIPTS REQUIRED BY THE CONTAINER DEPLOYMENT -->
    <script src="uv/uv.bundle.js" defer></script>
    <script src="uv/uv.config.js" defer></script>
</head>
<body>

    <div class="glow"></div>

    <div class="container">
        <h1>GENESIS</h1>
        <p>Enter a URL or search query to browse freely.</p>
        
        <form id="uv-form">
            <!-- DuckDuckGo Query Template Injection Link -->
            <input id="uv-search-engine" value="https://duckduckgo.com/?q=%s" type="hidden" />
            <input id="uv-address" type="text" placeholder="Search DuckDuckGo or type a URL..." autocomplete="off">
        </form>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('uv-form');
            const address = document.getElementById('uv-address');
            const searchEngine = document.getElementById('uv-search-engine');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                let url = address.value.trim();
                
                // Formats search into DuckDuckGo natively inside the sandbox context
                if (!isUrl(url)) {
                    url = searchEngine.value.replace('%s', encodeURIComponent(url));
                } else if (!(url.startsWith('https://') || url.startsWith('http://'))) {
                    url = 'https://' + url;
                }

                if ('serviceWorker' in navigator) {
                    try {
                        // Dynamically links into the ultraviolet setup config values
                        await navigator.serviceWorker.register('uv/uv.sw.js', {
                            scope: __uv$config.prefix
                        });
                        
                        // Forces page transition inside the same active browser window
                        window.location.href = __uv$config.prefix + __uv$config.encodeUrl(url);
                    } catch (err) {
                        alert('Could not start proxy session. Check your Railway runtime logs.');
                        console.error(err);
                    }
                } else {
                    alert('Service workers are disabled or unsupported by your web browser.');
                }
            });

            function isUrl(val = '') {
                if (/^http(s?):\/\//.test(val)) return true;
                const reg = /^(([a-zA-Z0-9#_$-]+)\.)+([a-zA-Z]{2,63})/;
                return reg.test(val);
            }
        });
    </script>
</body>
</html>
