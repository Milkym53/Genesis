        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {

            top: 0; left: 0; bottom: 0; right: 0;

            pointer-events: none;

        /* App Wrapper Layout Matrix */

            width: 100%;

            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);

        .system-brand {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;

        .tab-controller-pool {
            display: flex;
            gap: 8px;
            max-width: 50%;
            overflow-x: auto;
        }

        .proxy-tab-node {
            background: #121224;
            border: 1px solid rgba(255,255,255,0.05);

        .proxy-tab-node.active-tab {
            background: var(--panel-bg);
            border-color: var(--neon-cyan);
            color: #fff;

        .kill-tab-btn {
            color: var(--neon-pink);
            font-weight: bold;
            cursor: pointer;

            flex-direction: column;

            justify-content: center;

            top: 55px; left: 0; right: 0; bottom: 0;
            z-index: 10;

        .main-brand-banner {

            font-weight: 900;

            box-shadow: 0 0 25px rgba(130, 0, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);

        .search-engine-icon {

            top: 50%;

        }

        /* System Game Library Grids UI Layout */
        .library-section-frame {
            width: 100%;

        }

        .library-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: var(--neon-cyan);

            text-transform: uppercase;
            letter-spacing: 2px;
            border-left: 4px solid var(--neon-pink);
            padding-left: 12px;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
        }

        .apps-matrix-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(115px, 115px));
            gap: 26px;
            justify-content: center;
            background: rgba(11, 11, 22, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.03);
            padding: 35px;
            border-radius: 24px;
            backdrop-filter: blur(20px);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 10px 40px rgba(0,0,0,0.5);
        }

        .app-node-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.25);
        }

        .app-node-card:hover { transform: translateY(-8px); }

        .icon-box-wrapper {
            width: 80px;
            height: 80px;
            background: #111122;
            border: 2px solid #22223b;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.3rem;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        /* Cyber Color Grid Distributions */
        .app-node-card:nth-child(4n+1) .icon-box-wrapper { border-color: var(--neon-pink); }
        .app-node-card:nth-child(4n+2) .icon-box-wrapper { border-color: var(--neon-cyan); }
        .app-node-card:nth-child(4n+3) .icon-box-wrapper { border-color: var(--neon-purple); }
        .app-node-card:nth-child(4n+4) .icon-box-wrapper { border-color: #ffaa00; }
        .app-node-card:hover .icon-box-wrapper { box-shadow: 0 0 25px currentColor; border-color: #fff; }

        .app-label-title {
            font-size: 0.95rem;
            font-weight: 700;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            color: #cccce0;
            text-transform: uppercase;
        }

        .app-node-card:hover .app-label-title { color: #fff; }

        .import-trigger-node:hover .icon-box-wrapper { border-color: var(--neon-cyan); color: var(--neon-cyan); }

        .render-frame-node { width: 100%; height: 100%; border: none; background: #fff; }

let globalTabCollection = [];
let primaryActiveTabId = null;

// Core Proxy URL resolution mapping function matching Ultraviolet syntax requirements
function resolveProxiedUrlString(inputQueryString) {
let processedUrlString = inputQueryString.trim();
// DuckDuckGo routing fallback validation check loops
if (!processedUrlString.includes('.') || processedUrlString.includes(' ')) {
// Generates a clean, fully functional server-compliant search string parsed explicitly via standard search query logic
processedUrlString = 'duckduckgo.com' + encodeURIComponent(processedUrlString);
} else if (!processedUrlString.startsWith('http://') && !processedUrlString.startsWith('https://')) {
processedUrlString = 'https://' + processedUrlString;
}
// Checks verification layers for client engine variables matching local ultraviolet bundles
if (typeof __uv$config !== 'undefined') {
return __uv$config.prefix + __uv$config.encodeUrl(processedUrlString);
} else {
// Fallback default routing scenario loop maps natively if background worker systems disconnect
return processedUrlString;
}
}
// Tab allocation manager engine blocks
function spawnProxyTab(targetDestinationRawLink, dynamicTabDisplayTitle) {
const structuralTabId = 'tab_node_' + Date.now();
const finalProcessedProxyUrl = resolveProxiedUrlString(targetDestinationRawLink);
// Build out clean title logs
let titleLog = dynamicTabDisplayTitle || targetDestinationRawLink;
if (titleLog.length > 18) titleLog = titleLog.substring(0, 15) + '...';
// Generate structural components and inject straight down to execution spaces
const wrapperFrameContainer = document.createElement('div');
wrapperFrameContainer.id = 'viewport_frame_' + structuralTabId;
wrapperFrameContainer.className = 'sandbox-iframe-viewport-container';
wrapperFrameContainer.innerHTML = <iframe class="render-frame-node" id="iframe_element_${structuralTabId}" src="${finalProcessedProxyUrl}"></iframe>;
document.getElementById('viewportWrapper').appendChild(wrapperFrameContainer);
// Commit settings straight down memory index matrices
globalTabCollection.push({
id: structuralTabId,
title: titleLog,
url: finalProcessedProxyUrl
});
rebuildTabInterfaceRowBar();
switchActiveTabContext(structuralTabId);
}
function rebuildTabInterfaceRowBar() {
const containerNode = document.getElementById('activeTabsPoolContainer');
containerNode.innerHTML = '';
globalTabCollection.forEach(tab => {
const tabElement = document.createElement('div');
tabElement.className = proxy-tab-node ${tab.id === primaryActiveTabId ? 'active-tab' : ''};
tabElement.setAttribute('onclick', switchActiveTabContext('${tab.id}'));
tabElement.innerHTML = <span>${tab.title}</span> <span class="kill-tab-btn" onclick="terminateTabInstance(event, '${tab.id}')">×</span>;
containerNode.appendChild(tabElement);
});
}
function switchActiveTabContext(targetTabId) {
primaryActiveTabId = targetTabId;
// Hide Dashboard Front-page layers out cleanly
document.getElementById('genesisDashboardScreen').style.display = 'none';
// Reset standard viewing classes down across all target frames
document.querySelectorAll('.sandbox-iframe-viewport-container').forEach(view => {
view.classList.remove('active-view');
});
// Make chosen focus asset tab visible onto viewport canvas
const focalTargetFrame = document.getElementById('viewport_frame_' + targetTabId);
if (focalTargetFrame) {
focalTargetFrame.classList.add('active-view');
}
rebuildTabInterfaceRowBar();
}
function navigateToDashboardHome() {
primaryActiveTabId = null;
document.querySelectorAll('.sandbox-iframe-viewport-container').forEach(view => {
view.classList.remove('active-view');
});
document.getElementById('genesisDashboardScreen').style.display = 'flex';
rebuildTabInterfaceRowBar();
}
function terminateTabInstance(eventObject, targetTabIdToKill) {
eventObject.stopPropagation(); // Avoid triggering switch context loops on parent element clicks
// Purge active DOM node structures directly from layout space
const targetDomFrame = document.getElementById('viewport_frame_' + targetTabIdToKill);
if (targetDomFrame) {
// Wipe source clean first to safely terminate background game audio cycles instantly
const insideIframe = document.getElementById(iframe_element_${targetTabIdToKill});
if (insideIframe) insideIframe.src = 'about:blank';
targetDomFrame.remove();
}
// Remove tracked item reference arrays out from index caches
globalTabCollection = globalTabCollection.filter(tab => tab.id !== targetTabIdToKill);
if (primaryActiveTabId === targetTabIdToKill) {
if (globalTabCollection.length > 0) {
switchActiveTabContext(globalTabCollection[globalTabCollection.length - 1].id);
} else {
navigateToDashboardHome();
}
} else {
rebuildTabInterfaceRowBar();
}
}
// Catch enter command triggers down across text field layers
document.getElementById('proxySearchEngineMainField').addEventListener('keydown', function(e) {
if (e.key === 'Enter' && this.value.trim()) {
spawnProxyTab(this.value, this.value);
this.value = ''; // Flush bar context space out immediately following execution
}
});
// Dynamic Modals Framework Actions
function openImportWizardModal() { document.getElementById('customImportWizardModal').style.display = 'flex'; }
function closeImportWizardModal() { document.getElementById('customImportWizardModal').style.display = 'none'; }
function commitSaveImportedNode() {
const label = document.getElementById('wizardInputName').value.trim();
const link = document.getElementById('wizardInputUrl').value.trim();
let iconSymbol = document.getElementById('wizardInputIcon').value.trim() || '🎮';
if (!label || !link) return alert('Deployment Failure: Required source properties are currently missing fields.');
let activeCacheList = JSON.parse(localStorage.getItem('genesis_premium_library')) || [];
activeCacheList.push({ label, link, iconSymbol });
localStorage.setItem('genesis_premium_library', JSON.stringify(activeCacheList));
renderImportedLibraryNodes();
closeImportWizardModal();
document.getElementById('wizardInputName').value = '';
document.getElementById('wizardInputUrl').value = '';
document.getElementById('wizardInputIcon').value = '';
}
function renderImportedLibraryNodes() {
document.querySelectorAll('.runtime-loaded-custom-card').forEach(card => card.remove());
const displayTargetGrid = document.getElementById('appsLibraryContainerNode');
const insertBeforePlaceholderNode = document.querySelector('.import-trigger-node');
const collectionCache = JSON.parse(localStorage.getItem('genesis_premium_library')) || [];
collectionCache.forEach(nodeItem => {
const nodeCardDiv = document.createElement('div');
nodeCardDiv.className = "app-node-card runtime-loaded-custom-card";
nodeCardDiv.onclick = function() { spawnProxyTab(nodeItem.link, nodeItem.label); };
nodeCardDiv.innerHTML = <div class="icon-box-wrapper">${nodeItem.iconSymbol}</div> <div class="app-label-title">${nodeItem.label}</div>;
displayTargetGrid.insertBefore(nodeCardDiv, insertBeforePlaceholderNode);
});
}// Tab system track states memory allocations
