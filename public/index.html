<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genesis Proxy Dashboard</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Orbitron:wght@500;800&family=Play:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0b12;
            --panel-bg: #141423;
            --neon-pink: #ff2a74;
            --neon-cyan: #00f0ff;
            --neon-purple: #9d4edd;
            --text-main: #f0f0f8;
            --text-muted: #8a8a9e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Play', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 50% 0%, rgba(255, 42, 116, 0.15) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(0, 240, 255, 0.1) 0px, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 40px 20px;
        }

        /* Active App State Wrapper */
        #mainUi {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .brand-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: #fff;
            text-shadow: 0 0 5px #fff, 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
            animation: pulse 3s infinite alternate;
        }

        /* Proxy Search Engine Component */
        .search-container {
            width: 100%;
            max-width: 650px;
            position: relative;
            margin-bottom: 45px;
        }

        .search-bar {
            width: 100%;
            padding: 16px 24px;
            padding-left: 55px;
            background: rgba(20, 20, 35, 0.75);
            border: 2px solid var(--neon-purple);
            border-radius: 50px;
            font-family: 'Play', sans-serif;
            font-size: 1.1rem;
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(157, 78, 221, 0.2);
        }

        .search-bar:focus {
            border-color: var(--neon-pink);
            box-shadow: 0 0 25px rgba(255, 42, 116, 0.4);
        }

        .search-icon {
            position: absolute;
            left: 22px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        /* Custom Dashboard Config options */
        .config-panel {
            margin-bottom: 20px;
            background: rgba(20, 20, 35, 0.6);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.05);
            font-size: 0.85rem;
        }
        
        .config-panel select {
            background: #000;
            color: var(--neon-cyan);
            border: 1px solid var(--neon-purple);
            padding: 3px 8px;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }

        /* System Grid Layout */
        .dashboard-section {
            width: 100%;
            max-width: 800px;
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            letter-spacing: 2px;
            color: var(--neon-cyan);
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 110px));
            gap: 24px;
            justify-content: center;
            background: rgba(20, 20, 35, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .game-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .game-card:hover { transform: translateY(-5px); }

        .icon-wrapper {
            width: 75px;
            height: 75px;
            background: var(--panel-bg);
            border: 2px solid #2a2a40;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }

        /* Color profiles */
        .game-card:nth-child(3n+1) .icon-wrapper { border-color: var(--neon-pink); }
        .game-card:nth-child(3n+2) .icon-wrapper { border-color: var(--neon-cyan); }
        .game-card:nth-child(3n+3) .icon-wrapper { border-color: var(--neon-purple); }
        .game-card:hover .icon-wrapper { box-shadow: 0 0 20px currentColor; border-color: #fff; }

        .game-title {
            font-size: 0.85rem;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .add-card .icon-wrapper { border: 2px dashed var(--text-muted); background: transparent; color: var(--text-muted); }
        .add-card:hover .icon-wrapper { border-color: var(--neon-cyan); color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }

        /* Embedded Proxy Viewframe Window Layer */
        #proxyViewport {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000;
            z-index: 1000;
            flex-direction: column;
        }

        .viewport-header {
            background: var(--panel-bg);
            border-bottom: 2px solid var(--neon-purple);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .viewport-title {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-cyan);
            font-size: 0.9rem;
        }

        .close-btn {
            background: var(--neon-pink);
            color: #fff;
            border: none;
            padding: 6px 16px;
            border-radius: 4px;
            font-family: 'Play', sans-serif;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(255, 42, 116, 0.4);
        }

        .proxy-frame {
            width: 100%;
            flex-grow: 1;
            border: none;
            background: #fff;
        }

        /* Modal Overlay configuration */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 10, 0.85);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 2px solid var(--neon-cyan);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; }
        .form-input { width: 100%; padding: 10px 14px; background: #0b0b12; border: 1px solid #2a2a40; border-radius: 8px; color: #fff; outline: none; }
        .form-input:focus { border-color: var(--neon-cyan); }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: 'Play', sans-serif; }
        .btn-primary { background: var(--neon-cyan); color: #000; }
        .btn-secondary { background: #2a2a40; color: #fff; }

        @keyframes pulse {
            0% { text-shadow: 0 0 5px #fff, 0 0 10px var(--neon-cyan); }
            100% { text-shadow: 0 0 10px #fff, 0 0 20px var(--neon-cyan), 0 0 30px var(--neon-cyan); }
        }
    </style>
</head>
<body>

    <!-- Main Client Dashboard Layout Panel -->
    <div id="mainUi">
        <div class="brand-header">
            <h1>Genesis</h1>
        </div>

        <!-- Global Proxy Backend Instance Selector -->
        <div class="config-panel">
            <label for="proxyWorker">Proxy Node Gateway: </label>
            <select id="proxyWorker">
                <option value="https://allorigins.win">Node Alpha (AllOrigins Relay)</option>
                <option value="https://corsproxy.io?">Node Beta (CorsProxy Edge)</option>
                <option value="direct">Direct Engine (No Proxy Routing)</option>
            </select>
        </div>

        <!-- Active Search Input Element -->
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-bar" id="searchBar" placeholder="Launch game app URL or search via proxy...">
        </div>

        <div class="dashboard-section">
            <h2 class="section-title">🎮 Proxy Web Library</h2
