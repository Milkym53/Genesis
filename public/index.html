<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genesis Dashboard</title>
    <!-- Google Fonts for the retro neon look -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Orbitron:wght@500;800&family=Play:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0b12;
            --panel-bg: #141423;
            --neon-pink: #ff2a74;
            --neon-cyan: #00f0ff;
            --neon-purple: #9d4edd;
            --text-main: #f0f0f8;
            --text-muted: #8a8a9e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Play', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 50% 0%, rgba(255, 42, 116, 0.15) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(0, 240, 255, 0.1) 0px, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 40px 20px;
        }

        /* Branding Header */
        .brand-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .brand-header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: #fff;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px var(--neon-cyan),
                0 0 20px var(--neon-cyan),
                0 0 40px var(--neon-cyan);
            animation: pulse 3s infinite alternate;
        }

        /* Search Engine Area */
        .search-container {
            width: 100%;
            max-width: 650px;
            position: relative;
            margin-bottom: 45px;
        }

        .search-bar {
            width: 100%;
            padding: 16px 24px;
            padding-left: 55px;
            background: rgba(20, 20, 35, 0.75);
            border: 2px solid var(--neon-purple);
            border-radius: 50px;
            font-family: 'Play', sans-serif;
            font-size: 1.1rem;
            color: #fff;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(157, 78, 221, 0.2);
        }

        .search-bar:focus {
            border-color: var(--neon-pink);
            box-shadow: 0 0 25px rgba(255, 42, 116, 0.4), inset 0 0 10px rgba(255, 42, 116, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 22px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        /* Games Board Area */
        .dashboard-section {
            width: 100%;
            max-width: 800px;
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            letter-spacing: 2px;
            color: var(--neon-cyan);
            margin-bottom: 20px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 110px));
            gap: 24px;
            justify-content: center;
            background: rgba(20, 20, 35, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        /* Game Card Buttons */
        .game-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .game-card:hover {
            transform: translateY(-5px);
        }

        .icon-wrapper {
            width: 75px;
            height: 75px;
            background: var(--panel-bg);
            border: 2px solid #2a2a40;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin-bottom: 10px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        /* Cyber Theme Color Variances for items */
        .game-card:nth-child(3n+1) .icon-wrapper { border-color: var(--neon-pink); box-shadow: 0 0 10px rgba(255, 42, 116, 0.2); }
        .game-card:nth-child(3n+2) .icon-wrapper { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0, 240, 255, 0.2); }
        .game-card:nth-child(3n+3) .icon-wrapper { border-color: var(--neon-purple); box-shadow: 0 0 10px rgba(157, 78, 221, 0.2); }

        .game-card:hover .icon-wrapper {
            box-shadow: 0 0 20px currentColor;
            border-color: #fff;
        }

        .game-title {
            font-size: 0.85rem;
            font-weight: 500;
            text-align: center;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        /* Specialized Import Button Action */
        .add-card .icon-wrapper {
            border: 2px dashed var(--text-muted);
            background: transparent;
            color: var(--text-muted);
            box-shadow: none !important;
        }

        .add-card:hover .icon-wrapper {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3) !important;
        }

        /* Pop-up Interface for Importing Custom Links/Games */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 10, 0.85);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
        }

        .modal-content h3 {
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 20px;
            color: #fff;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .form-input {
            width: 100%;
            padding: 10px 14px;
            background: #0b0b12;
            border: 1px solid #2a2a40;
            border-radius: 8px;
            color: #fff;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--neon-cyan);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Play', sans-serif;
        }

        .btn-primary {
            background: var(--neon-cyan);
            color: #000;
        }

        .btn-secondary {
            background: #2a2a40;
            color: #fff;
        }

        @keyframes pulse {
            0% { text-shadow: 0 0 5px #fff, 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan); }
            100% { text-shadow: 0 0 10px #fff, 0 0 20px var(--neon-cyan), 0 0 35px var(--neon-cyan), 0 0 50px var(--neon-cyan); }
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="brand-header">
        <h1>Genesis</h1>
    </div>

    <!-- Retro Search Module -->
    <div class="search-container">
        <span class="search-icon">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </span>
        <input type="text" class="search-bar" id="searchBar" placeholder="Search application or enter Web URL...">
    </div>

    <!-- Active Games Panel Layout -->
    <div class="dashboard-section">
        <h2 class="section-title">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"></rect><path d="M6 12h4M8 10v4M15 11h.01M18 13h.01"></path></svg>
            System Apps & Games
        </h2>
        
        <div class="games-grid" id="gamesGrid">
            <!-- Default Integrated Core Platforms -->
            <a href="https://www.youtube.com" class="game-card" target="_blank">
                <div class="icon-wrapper" style="color: var(--neon-pink);">📺</div>
                <div class="game-title">YouTube</div>
            </a>
            <a href="https://discord.com" class="game-card" target="_blank">
                <div class="icon-wrapper" style="color: var(--neon-cyan);">💬</div>
                <div class="game-title">Discord</div>
            </a>
