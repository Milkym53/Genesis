<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GENESIS PROXY</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=VT323&display=swap');

        :root {
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-yellow: #ffff00;
            --bg-dark: #050505;
            --glass-bg: rgba(20, 20, 20, 0.8);
            --grid-color: rgba(0, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--neon-cyan);
            font-family: 'VT323', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Background Grid Effect */
        .grid-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
            perspective: 500px;
            transform: scale(1.2);
            opacity: 0.3;
            z-index: -1;
        }

        /* CRT Scanline Effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        /* Main Container */
        .container {
            width: 90%;
            max-width: 800px;
            background: var(--glass-bg);
            border: 2px solid var(--neon-cyan);
            box-shadow: 
                0 0 20px var(--neon-cyan),
                inset 0 0 20px rgba(0, 255, 255, 0.2);
            padding: 2rem;
            position: relative;
            backdrop-filter: blur(5px);
        }

        /* Corner Decorations */
        .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid var(--neon-pink);
        }
        .tl { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .tr { top: -2px; right: -2px; border-left: none; border-bottom: none; }
        .bl { bottom: -2px; left: -2px; border-right: none; border-top: none; }
        .br { bottom: -2px; right: -2px; border-left: none; border-top: none; }

        /* Title */
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            text-align: center;
            color: var(--neon-pink);
            text-shadow: 
                0 0 5px var(--neon-pink),
                0 0 10px var(--neon-pink),
                0 0 20px var(--neon-pink);
            margin-bottom: 1.5rem;
            letter-spacing: 5px;
            animation: flicker 3s infinite;
        }

        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                opacity: 1;
            }
            20%, 24%, 55% {
                opacity: 0.6;
            }
        }

        /* Input Area */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex-grow: 1;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 15px;
            font-family: 'VT323', monospace;
            font-size: 1.2rem;
            outline: none;
            box-shadow: inset 0 0 10px rgba(0, 255, 255, 0.1);
        }

        input[type="text"]::placeholder {
            color: rgba(0, 255, 255, 0.5);
        }

        input[type="text"]:focus {
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        button {
            background: transparent;
            border: 2px solid var(--neon-pink);
            color: var(--neon-pink);
            padding: 15px 30px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px var(--neon-pink);
        }

        button:hover {
            background: var(--neon-pink);
            color: #000;
            box-shadow: 0 0 20px var(--neon-pink);
        }

        button:active {
            transform: scale(0.98);
        }

        /* Terminal Log */
        .terminal {
            background: #000;
            border: 1px solid var(--neon-yellow);
            height: 150px;
            overflow-y: auto;
            padding: 10px;
            font-size: 0.9rem;
            color: var(--neon-yellow);
            box-shadow: inset 0 0 10px rgba(255, 255, 0, 0.1);
        }

        .log-entry {
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .log-entry.success { color: #00ff00; }
        .log-entry.error { color: #ff0000; }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #000;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--neon-cyan);
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .input-group { flex-direction: column; }
            button { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="grid-bg"></div>
    <div class="scanlines"></div>

    <div class="container">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>

        <h1>GENESIS</h1>

        <div class="input-group">
            <input type="text" id="urlInput" placeholder="ENTER TARGET URL (e.g., https://example.com)" autocomplete="off">
            <button id="connectBtn">CONNECT</button>
        </div>

        <div class="terminal" id="terminalLog">
            <div class="log-entry">> SYSTEM INITIALIZED...</div>
            <div class="log-entry">> AWAITING INPUT...</div>
        </div>
    </div>

    <script>
        const btn = document.getElementById('connectBtn');
        const input = document.getElementById('urlInput');
        const terminal = document.getElementById('terminalLog');

        function log(message, type = '') {
            const div = document.createElement('div');
            div.className = `log-entry ${type}`;
            const time = new Date().toLocaleTimeString('en-US', { hour12: false });
            div.textContent = `[${time}] > ${message}`;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        btn.addEventListener('click', () => {
            const url = input.value.trim();
            if (!url) {
                log('ERROR: NO URL SPECIFIED', 'error');
                return;
            }

            // Simulate connection process
            log(`INITIATING HANDSHAKE FOR: ${url}...`);
            
            setTimeout(() => {
                log('RESOLVING DNS...', '');
            }, 500);

            setTimeout(() => {
                log('ESTABLISHING SECURE TUNNEL...', '');
            }, 1000);

            setTimeout(() => {
                log('CONNECTION ESTABLISHED.', 'success');
                // Here you would normally redirect or load the iframe
                // window.location.href = `/proxy?url=${encodeURIComponent(url)}`;
                
                // For demo purposes:
                alert(`Proxy connected to: ${url}\n\n(This is where your proxy logic goes)`);
            }, 1500);
        });

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                btn.click();
            }
        });

        // Initial boot sequence simulation
        setTimeout(() => log('NEURAL LINK STABLE'), 2000);
        setTimeout(() => log('READY FOR COMMANDS'), 3000);
    </script>
</body>
</html>
